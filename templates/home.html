<!DOCTYPE html>
<html>
<head>
    <title>Soundboard - Welcome</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 100px auto; 
            padding: 20px; 
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        h1 { font-size: 3em; margin-bottom: 20px; }
        p { font-size: 1.2em; margin-bottom: 40px; }
        .btn { 
            display: inline-block; 
            padding: 15px 30px; 
            margin: 15px; 
            background: rgba(255,255,255,0.2); 
            color: white; 
            text-decoration: none; 
            border-radius: 50px; 
            font-size: 1.1em;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            transition: all 0.3s;
        }
        .btn:hover { 
            background: rgba(255,255,255,0.3); 
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <h1>🎵 Soundboard</h1>
    <p>Your personal sound collection with YouTube import</p>
    
    <div>
        <a href="/register" class="btn">Create Account</a>
        <a href="/login" class="btn">Login</a>
    </div>
    
    <p style="margin-top: 50px; font-size: 0.9em; opacity: 0.8;">
        For team use only - personal recordings
    </p>
</body>
</html>
