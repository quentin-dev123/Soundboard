<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Settings - Soundboard</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 1.5rem;
      background: canvas;
      color: canvastext;
    }
    main {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    header a {
      padding: 0.5rem 1rem;
      background: #1f73ff;
      color: white;
      text-decoration: none;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    header a:hover {
      opacity: 0.9;
    }
    .section {
      padding: 1.5rem;
      border-radius: 1rem;
      border: 1px solid color-mix(in srgb, canvastext 15%, canvas);
      background: color-mix(in srgb, canvastext 6%, canvas);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .section h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.2rem;
    }
    .section p {
      margin: 0;
      font-size: 0.95rem;
      color: color-mix(in srgb, canvastext 70%, canvas);
      line-height: 1.5;
    }
    .status {
      padding: 0.75rem 1rem;
      border-radius: 0.6rem;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .status.authenticated {
      background: color-mix(in srgb, #4caf50 20%, canvas);
      color: #2e7d32;
      border: 1px solid #4caf50;
    }
    .status.not-authenticated {
      background: color-mix(in srgb, #ff9800 20%, canvas);
      color: #e65100;
      border: 1px solid #ff9800;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 0.6rem;
      padding: 0.75rem 1rem;
      font-weight: 600;
      color: white;
      background: #1f73ff;
      transition: opacity 0.2s;
      font-size: 0.95rem;
      align-self: flex-start;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .message {
      padding: 0.75rem 1rem;
      border-radius: 0.6rem;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    .message.success {
      background: color-mix(in srgb, #4caf50 20%, canvas);
      color: #2e7d32;
      border: 1px solid #4caf50;
    }
    .message.error {
      background: color-mix(in srgb, #f44336 20%, canvas);
      color: #c62828;
      border: 1px solid #f44336;
    }
    .loading {
      display: none;
      text-align: center;
      padding: 2rem 0;
    }
    .spinner {
      border: 3px solid color-mix(in srgb, canvastext 10%, canvas);
      border-top: 3px solid #1f73ff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .instructions {
      background: color-mix(in srgb, canvastext 3%, canvas);
      padding: 1rem;
      border-radius: 0.6rem;
      border-left: 4px solid #1f73ff;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .instructions ol {
      margin: 0;
      padding-left: 1.5rem;
    }
    .instructions li {
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Settings</h1>
      <a href="/soundboard">Back to Soundboard</a>
    </header>

    <section class="section">
      <h2>General settings</h2>
      <p>
        There are no additional settings at this time.
      </p>
    </section>
  </main>

  <script>
    // No settings script required currently.
  </script>
</body>
</html>
