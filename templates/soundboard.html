<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Soundboard</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 1.5rem;
      background: canvas;
      color: canvastext;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    header {
      text-align: center;
    }
    form {
      display: grid;
      gap: 0.9rem;
      padding: 1rem;
      border-radius: 0.9rem;
      background: color-mix(in srgb, canvastext 8%, canvas);
      border: 1px solid color-mix(in srgb, canvastext 12%, canvas);
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.95rem;
    }
    input[type="text"],
    input[type="file"] {
      padding: 0.6rem;
      border-radius: 0.6rem;
      border: 1px solid color-mix(in srgb, canvastext 25%, canvas);
      background: canvas;
      color: inherit;
    }
    input[type="file"] {
      padding: 0.35rem;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 0.7rem;
      padding: 0.75rem 1rem;
      font-weight: 600;
      color: white;
      background: #1f73ff;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
    }
    .controls button {
      background: #e03232;
    }
    .sound-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .sound-card {
      padding: 1rem;
      border-radius: 1rem;
      border: 1px solid color-mix(in srgb, canvastext 15%, canvas);
      background: color-mix(in srgb, canvastext 6%, canvas);
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }
    .sound-card h3 {
      margin: 0;
      font-size: 1.1rem;
    }
    .sound-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .sound-actions button {
      flex: 1 1 120px;
      min-width: 120px;
    }
    .progress-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .progress-row input[type="range"] {
      flex: 1 1 auto;
      min-width: 180px;
    }
    .time-label {
      font-variant-numeric: tabular-nums;
      font-size: 0.9rem;
      color: color-mix(in srgb, canvastext 70%, canvas);
    }
    .empty-state {
      padding: 2rem;
      text-align: center;
      border-radius: 1rem;
      border: 1px dashed color-mix(in srgb, canvastext 25%, canvas);
      color: color-mix(in srgb, canvastext 70%, canvas);
    }
    .meta {
      font-size: 0.85rem;
      color: color-mix(in srgb, canvastext 70%, canvas);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }
    header > div:first-child {
      flex: 1;
    }
    header a {
      padding: 0.5rem 1rem;
      background: #666;
      color: white;
      text-decoration: none;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    header a:hover {
      opacity: 0.9;
    }

    /* Drag handle and drop styles */
    .drag-handle {
      width: 20px;
      height: 20px;
      display: inline-block;
      background: color-mix(in srgb, canvastext 30%, canvas);
      border-radius: 4px;
      margin-right: 0.6rem;
      cursor: grab;
    }
    .sound-card.dragging {
      opacity: 0.6;
    }
    .sound-card.over {
      outline: 2px dashed color-mix(in srgb, canvastext 25%, canvas);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Soundboard</h1>
        <p>Add short sound effects and control playback precisely.</p>
      </div>
      <a href="/settings">Settings</a>
    </header>

    <form id="sound-form">
      <label>
        Title
        <input id="title" type="text" placeholder="e.g., Airhorn" required />
      </label>

      <label>
        Sound file
        <input id="file" type="file" accept="audio/*" />
      </label>
      <button type="submit">Add sound</button>
    </form>

    <section class="controls">
      <span id="storage-stats" class="meta">Total stored: 0 KB</span>
      <button type="button" id="clear-btn">Clear all</button>
    </section>

    <section id="empty-state" class="empty-state">
      No sounds yet. Add your first clip above!
    </section>

    <section id="sound-list" class="sound-list" hidden></section>
  </main>

  <script>
    const DB_NAME = "SoundboardDB";
    const STORE_NAME = "sounds";
    const STORAGE_KEY = 'sound_meta';
    let db;
    const controllers = new Map();

    const form = document.getElementById("sound-form");
    const titleInput = document.getElementById("title");
    const fileInput = document.getElementById("file");
    const soundList = document.getElementById("sound-list");
    const emptyState = document.getElementById("empty-state");
    const storageStats = document.getElementById("storage-stats");
    const clearBtn = document.getElementById("clear-btn");

    init();

    async function init() {
      // Session authentication - server will handle redirection if not authenticated
      db = await openDB();
      await loadSoundsFromBackend();
      // attempt to upload any locally added sounds
      await syncPendingSounds();
      renderSounds();

      // Attach drag/drop handlers to sound list (delegated)
      soundList.addEventListener('dragstart', (e) => {
        const handle = e.target.closest('.drag-handle');
        const card = e.target.closest('.sound-card');
        console.debug('dragstart event', { target: e.target, handle, card });
        if (!card || !handle) {
          // only start drag when handle is used
          e.preventDefault();
          console.debug('dragstart prevented: not on handle');
          return;
        }
        e.dataTransfer.effectAllowed = 'move';
        // store id explicitly for older browsers that expect it
        try { e.dataTransfer.setData('text/plain', card.dataset.id); } catch (err) { /* ignore */ }
        card.classList.add('dragging');
      });

      soundList.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const draggedEl = soundList.querySelector('.sound-card.dragging');
        const target = e.target.closest('.sound-card');
        console.debug('dragover', { draggedElId: draggedEl?.dataset.id, over: target?.dataset?.id });

        // remove previous over classes
        soundList.querySelectorAll('.sound-card.over').forEach(n => n.classList.remove('over'));

        if (!draggedEl) return;
        if (!target || target === draggedEl) {
          // if no target or target is dragged element, append as last
          if (soundList.lastElementChild !== draggedEl) soundList.appendChild(draggedEl);
          return;
        }

        const rect = target.getBoundingClientRect();
        const after = (e.clientY - rect.top) > rect.height / 2;

        if (after) {
          if (target.nextSibling !== draggedEl) target.parentNode.insertBefore(draggedEl, target.nextSibling);
        } else {
          if (target !== draggedEl.nextSibling) target.parentNode.insertBefore(draggedEl, target);
        }

        target.classList.add('over');
      });

      soundList.addEventListener('drop', async (e) => {
        e.preventDefault();
        console.debug('drop event', { data: e.dataTransfer.getData('text/plain') });
        // finalise position and save order
        soundList.querySelectorAll('.sound-card.over').forEach(n => n.classList.remove('over'));
        const draggedEl = soundList.querySelector('.sound-card.dragging');
        if (draggedEl) draggedEl.classList.remove('dragging');
        await updateOrderFromDOM();
      });

      soundList.addEventListener('dragend', (e) => {
        const card = e.target.closest('.sound-card');
        console.debug('dragend', { target: e.target, card });
        if (card) card.classList.remove('dragging');
        soundList.querySelectorAll('.sound-card.over').forEach(n => n.classList.remove('over'));
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const title = titleInput.value.trim();
      const file = fileInput.files[0];

      if (!title || !file) {
        alert("Please enter a title and select a file");
        return;
      }

      try {
        // File flow: save locally first, then upload in background
        const localId = `local-${Date.now()}`;
        await saveSound({ id: localId, title, blob: file, size: file.size, synced: false });

        form.reset();
        renderSounds();

        // Start background upload, handle errors and mark entry if upload fails
        uploadSound(localId).catch((err) => {
          console.error('Upload failed for', localId, err);
          // mark entry with sync_error flag
          getEntry(localId).then((entry) => {
            if (!entry) return;
            entry.sync_error = true;
            saveSound(entry).then(renderSounds);
          });
        });
      } catch (error) {
        console.error("Error:", error);
        alert("Failed to add sound");
      }
    });

    clearBtn.addEventListener("click", async () => {
      if (!confirm("Delete all stored sounds? This cannot be undone.")) return;
      await clearStore();
      controllers.forEach((ctrl) => {
        ctrl.audio?.pause();
        if (ctrl.url) URL.revokeObjectURL(ctrl.url);
      });
      controllers.clear();
      renderSounds();
    });

    async function loadSoundsFromBackend() {
      try {
        const response = await fetch("/api/sounds", {
          method: "GET"
        });

        if (!response.ok) {
          console.error("Failed to load sounds");
          return;
        }

        const sounds = await response.json();
        for (const soundData of sounds) {
          const binaryString = atob(soundData.audio_base64);
          const bytes = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          const blob = new Blob([bytes], { type: "audio/mpeg" });

          await saveSound({
            id: soundData.id,
            title: soundData.title,
            blob,
            size: blob.size,
            file_path: soundData.file_path,
            synced: true
          });
        }
      } catch (error) {
        console.error("Error loading sounds from backend:", error);
      }
    }

    async function renderSounds() {
      const meta = await getAllSounds();
      updateStats(meta);

      // Cleanup any current controllers to avoid leaks
      controllers.forEach((ctrl) => {
        ctrl.audio?.pause();
        if (ctrl.url) URL.revokeObjectURL(ctrl.url);
      });
      controllers.clear();

      soundList.innerHTML = "";

      if (!meta.length) {
        emptyState.hidden = false;
        soundList.hidden = true;
        return;
      }

      emptyState.hidden = true;
      soundList.hidden = false;

      meta.forEach((item) => {
        const card = createSoundCard(item);
        soundList.appendChild(card);
      });

      // Apply saved order visually if needed
      const order = loadOrder();
      if (order && order.length) {
        const nodes = Array.from(soundList.children);
        const map = new Map(nodes.map(n => [n.dataset.id, n]));
        soundList.innerHTML = '';
        order.forEach(id => {
          const node = map.get(String(id));
          if (node) soundList.appendChild(node);
        });
        // append any missing nodes
        nodes.forEach(n => { if (!soundList.contains(n)) soundList.appendChild(n); });
      }
    }

    function createSoundCard({ id, title, size, synced, sync_error }) {
      const card = document.createElement("article");
      card.className = "sound-card";
      card.dataset.id = id;
      card.draggable = true;

      const headingRow = document.createElement('div');
      headingRow.style.display = 'flex';
      headingRow.style.alignItems = 'center';

      const handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.title = 'Drag to reorder';
      handle.setAttribute('role', 'button');
      handle.setAttribute('aria-label', 'Drag to reorder');
      handle.style.userSelect = 'none';
      handle.style.display = 'inline-flex';
      handle.style.alignItems = 'center';
      handle.style.justifyContent = 'center';
      handle.style.fontSize = '14px';
      handle.textContent = '≡';
      handle.draggable = false;

      const heading = document.createElement("h3");
      heading.style.margin = 0;
      heading.textContent = title;

      const status = document.createElement('span');
      status.style.marginLeft = '0.6rem';
      status.style.fontSize = '0.8rem';
      status.style.color = 'color-mix(in srgb, canvastext 60%, canvas)';
      if (sync_error) status.textContent = '⚠️ upload failed';
      else if (!synced) status.textContent = 'Uploading…';

      headingRow.append(handle, heading, status);

      const actions = document.createElement("div");
      actions.className = "sound-actions";

      const playBtn = document.createElement("button");
      playBtn.type = "button";
      playBtn.textContent = "Play";
      playBtn.addEventListener("click", () => togglePlay(id));

      const restartBtn = document.createElement("button");
      restartBtn.type = "button";
      restartBtn.textContent = "Restart";
      restartBtn.addEventListener("click", () => restartSound(id));

      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.textContent = "Delete";
      deleteBtn.style.background = "#e03232";
      deleteBtn.addEventListener("click", () => deleteSound(id));

      actions.append(playBtn, restartBtn, deleteBtn);

      const progressRow = document.createElement("div");
      progressRow.className = "progress-row";

      const progress = document.createElement("input");
      progress.type = "range";
      progress.min = 0;
      progress.max = 100;
      progress.value = 0;
      progress.step = 0.1;
      progress.disabled = true;
      progress.addEventListener("input", () => seekSound(id, progress.value));

      const timeLabel = document.createElement("span");
      timeLabel.className = "time-label";
      timeLabel.textContent = "0:00 / 0:00";

      progressRow.append(progress, timeLabel);

      const sizeLabel = document.createElement("span");
      sizeLabel.className = "meta";
      sizeLabel.textContent = `Size: ${(size / 1024).toFixed(1)} KB`;

      card.append(headingRow, actions, progressRow, sizeLabel);

      controllers.set(id, {
        id,
        playBtn,
        restartBtn,
        progress,
        timeLabel,
        isLoading: false,
        audio: null,
        url: null
      });

      return card;
    }

    async function ensureAudio(id) {
      const ctrl = controllers.get(id);
      if (!ctrl) throw new Error("Controller missing");

      if (ctrl.audio) return ctrl.audio;

      if (ctrl.isLoading) {
        return new Promise((resolve) => {
          const interval = setInterval(() => {
            if (ctrl.audio) {
              clearInterval(interval);
              resolve(ctrl.audio);
            }
          }, 50);
        });
      }

      ctrl.isLoading = true;
      ctrl.playBtn.textContent = "Loading…";
      ctrl.playBtn.disabled = true;
      ctrl.restartBtn.disabled = true;

      try {
        const blob = await getBlob(id);
        if (!blob) throw new Error("Audio data missing");
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);

        const updateUI = () => updateProgressUI(id);
        audio.addEventListener("timeupdate", updateUI);
        audio.addEventListener("durationchange", updateUI);
        audio.addEventListener("ended", () => {
          audio.pause();
          audio.currentTime = audio.duration || 0;
          updateProgressUI(id);
          setPlayLabel(id, false);
        });

        ctrl.audio = audio;
        ctrl.url = url;
        ctrl.progress.disabled = false;
        ctrl.playBtn.disabled = false;
        ctrl.restartBtn.disabled = false;
        setPlayLabel(id, false);
        updateProgressUI(id);
        return audio;
      } finally {
        ctrl.isLoading = false;
      }
    }

    async function togglePlay(id) {
      const audio = await ensureAudio(id);
      const isPlaying = !audio.paused;
      if (isPlaying) {
        audio.pause();
        setPlayLabel(id, false);
      } else {
        pauseOthers(id);
        await audio.play();
        setPlayLabel(id, true);
      }
    }

    async function restartSound(id) {
      const audio = await ensureAudio(id);
      audio.pause();
      audio.currentTime = 0;
      updateProgressUI(id);
      setPlayLabel(id, false);
    }

    async function seekSound(id, percent) {
      const audio = await ensureAudio(id);
      if (!audio.duration || audio.duration === Infinity) return;
      const nextTime = (percent / 100) * audio.duration;
      audio.currentTime = nextTime;
      updateProgressUI(id);
    }

    function pauseOthers(exceptId) {
      controllers.forEach((ctrl, id) => {
        if (id === exceptId) return;
        if (ctrl.audio && !ctrl.audio.paused) {
          ctrl.audio.pause();
          setPlayLabel(id, false);
        }
      });
    }

    function setPlayLabel(id, isPlaying) {
      const ctrl = controllers.get(id);
      if (!ctrl) return;
      ctrl.playBtn.textContent = isPlaying ? "Pause" : "Play";
    }

    function updateProgressUI(id) {
      const ctrl = controllers.get(id);
      if (!ctrl || !ctrl.audio) return;
      const { audio, progress, timeLabel } = ctrl;

      const duration = audio.duration && isFinite(audio.duration) ? audio.duration : 0;
      const current = audio.currentTime || 0;
      const percent = duration ? (current / duration) * 100 : 0;

      progress.value = percent;
      timeLabel.textContent = `${formatTime(current)} / ${duration ? formatTime(duration) : "0:00"}`;
    }

    function formatTime(seconds) {
      if (!isFinite(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function loadMeta() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function saveMeta(meta) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(meta));
    }

    const ORDER_KEY = 'sound_order';

    function loadOrder() {
      try {
        return JSON.parse(localStorage.getItem(ORDER_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function saveOrder(order) {
      localStorage.setItem(ORDER_KEY, JSON.stringify(order));
    }

    async function updateOrderFromDOM() {
      const ids = Array.from(soundList.querySelectorAll('.sound-card')).map(n => n.dataset.id);
      saveOrder(ids);
    }

    async function getAllSounds() {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const request = store.getAll();
        request.onsuccess = () => {
          const result = request.result || [];
          const order = loadOrder();
          // convert all ids to strings for consistent comparison
          const orderMap = new Map(order.map((id, idx) => [String(id), idx]));
          result.sort((a, b) => {
            const ia = orderMap.has(String(a.id)) ? orderMap.get(String(a.id)) : Infinity;
            const ib = orderMap.has(String(b.id)) ? orderMap.get(String(b.id)) : Infinity;
            if (ia === ib) return 0;
            return ia - ib;
          });
          // If some items are not in order, append them
          const orderedIds = order.map(String);
          const missing = result.filter(r => !orderedIds.includes(String(r.id))).map(r => String(r.id));
          if (missing.length) {
            const newOrder = order.concat(missing);
            saveOrder(newOrder);
          }
          resolve(result);
        };
        request.onerror = () => reject(request.error);
      });
    }

    function getEntry(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const request = store.get(id);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function deleteSound(id) {
      if (!confirm("Delete this sound?")) return;

      try {
        const entry = await getEntry(id);

        // If this sound has been synced to server, delete remotely first
        if (entry && entry.synced) {
          const response = await fetch(`/delete_sound/${id}`, { method: "DELETE" });
          if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            alert(`Error: ${error.error || "Failed to delete sound"}`);
            return;
          }
        }

        // Delete from IndexedDB
        await deleteSoundFromDB(id);

        // Stop playback
        const ctrl = controllers.get(id);
        if (ctrl) {
          ctrl.audio?.pause();
          if (ctrl.url) URL.revokeObjectURL(ctrl.url);
          controllers.delete(id);
        }

        // Remove from order if present
        const order = loadOrder();
        const idx = order.indexOf(String(id));
        if (idx !== -1) {
          order.splice(idx, 1);
          saveOrder(order);
        }

        renderSounds();
      } catch (error) {
        console.error("Error deleting sound:", error);
        alert("Failed to delete sound");
      }
    }

    async function deleteSoundFromDB(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        const request = store.delete(id);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    function updateStats(meta) {
      const totalBytes = meta.reduce((sum, item) => sum + (item.size || 0), 0);
      const kb = totalBytes / 1024;
      storageStats.textContent = `Total stored: ${
        kb >= 1024 ? (kb / 1024).toFixed(2) + " MB" : kb.toFixed(1) + " KB"
      } (${meta.length} item${meta.length === 1 ? "" : "s"})`;
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onerror = () => reject(request.error);
        request.onupgradeneeded = () => {
          const database = request.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: "id" });
          }
        };
        request.onsuccess = () => resolve(request.result);
      });
    }

    function saveSound(soundData) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        const entry = {
          id: soundData.id,
          title: soundData.title,
          blob: soundData.blob,
          size: soundData.size,
          file_path: soundData.file_path,
          synced: soundData.synced || false,
          sync_error: soundData.sync_error || false
        };
        const request = store.put(entry);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    function getBlob(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const request = store.get(id);
        request.onsuccess = () => resolve(request.result ? request.result.blob : null);
        request.onerror = () => reject(request.error);
      });
    }

    function clearStore() {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        const request = store.clear();
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    /* Helpers for background upload and syncing */
    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(blob);
      });
    }

    async function uploadSound(localId) {
      const entry = await getEntry(localId);
      if (!entry) throw new Error('Local entry missing');
      if (entry.synced) return;

      const dataUrl = await blobToBase64(entry.blob);
      const base64String = dataUrl.split(',')[1];

      const response = await fetch('/new_sound', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: entry.title, audio_base64: base64String })
      });

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.error || 'Upload failed');
      }

      const soundData = await response.json();
      await migrateLocalToServerId(localId, soundData);
    }

    async function migrateLocalToServerId(localId, soundData) {
      const entry = await getEntry(localId);
      if (!entry) return;

      const newEntry = {
        id: soundData.id,
        title: soundData.title || entry.title,
        blob: entry.blob,
        size: entry.size || (entry.blob ? entry.blob.size : 0),
        file_path: soundData.file_path,
        synced: true
      };

      await deleteSoundFromDB(localId);
      await saveSound(newEntry);

      const order = loadOrder();
      const idx = order.indexOf(localId);
      if (idx !== -1) {
        order[idx] = newEntry.id;
        saveOrder(order);
      } else {
        order.push(newEntry.id);
        saveOrder(order);
      }

      if (controllers.has(localId)) {
        const ctrl = controllers.get(localId);
        controllers.delete(localId);
        ctrl.id = newEntry.id;
        controllers.set(newEntry.id, ctrl);
      }

      renderSounds();
    }

    async function syncPendingSounds() {
      const all = await getAllSounds();
      for (const entry of all) {
        if (String(entry.id).startsWith('local-') || entry.synced === false) {
          uploadSound(entry.id).catch(err => console.error('sync failed', entry.id, err));
        }
      }
    }
  </script>
</body>
